<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Geldzicht</title>
  <meta name="description" content="Persoonlijk overzicht van inkomsten en uitgaven">
  <meta name="theme-color" content="#13222e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Geldzicht">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="boot" id="boot">
      <div class="boot-mark" aria-hidden="true"></div>
      <p>Geldzicht laden</p>
    </div>
  </div>
  <input type="file" id="fileInput" hidden>
  <input type="file" id="backupInput" accept=".json,application/json" hidden>
  <div id="sheetRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="lib/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
