name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) Chrome/126 Safari/537.36"
          S=$(curl -s -A "$UA" "https://api.onvista.de/api/v1/instruments/search/facet?searchValue=US5951121038")
          echo "== search"; echo "$S" | jq -c '.facets[] | {type, r: [.results[]? | {entityType, entityValue, name, isin, urls: (.urls|keys?)}]}' | head -c 900; echo
          EV=$(echo "$S" | jq -r '[.facets[].results[]?][0].entityValue'); echo "ev $EV"
          SN=$(curl -s -A "$UA" "https://api.onvista.de/api/v1/stocks/$EV/snapshot")
          echo "== snapshot keys"; echo "$SN" | jq -c 'keys' | head -c 500; echo
          echo "$SN" | jq -c '.quote | {last, isoCurrency, market: .market, datetimeLast}' | head -c 600; echo
          echo "$SN" | jq -c '[.quoteList.list[]? | {id: .market.idNotation, n: .market.name, c: .isoCurrency, v: .volume}]' | head -c 900; echo
          IDN=$(echo "$SN" | jq -r '.quote.market.idNotation')
          for u in "https://api.onvista.de/api/v1/instruments/STOCK/$EV/chart_history?endDate=2026-11-14&idNotation=$IDN&resolution=1D&startDate=2026-10-14" "https://api.onvista.de/api/v1/instruments/STOCK/$EV/eod_history?idNotation=$IDN&range=M1&startDate=2026-10-14"; do
            echo "== $u"; curl -s -A "$UA" -o /tmp/o -w "%{http_code} %{size_download}\n" "$u"; head -c 500 /tmp/o; echo
          done
